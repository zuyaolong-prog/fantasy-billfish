# Billfish HDR -> SDR preview profile.
# Input examples found in this task are 10-bit BT.2020/PQ HDR video.
# Force an SDR target so mpv tone-maps instead of passing washed-out HDR to an SDR desktop.

vo=gpu-next
gpu-api=d3d11
hwdec=auto-safe

target-colorspace-hint=auto
target-trc=bt.1886
target-prim=bt.709
target-gamut=bt.709
tone-mapping=bt.2446a
gamut-mapping-mode=perceptual
hdr-compute-peak=auto

keep-open=no
save-position-on-quit=no
osd-bar=yes
border=yes
